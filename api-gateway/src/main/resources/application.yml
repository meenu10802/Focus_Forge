server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: "*"
            exposed-headers: [Idempotency-Key, X-Trace-Id]
            allow-credentials: true
            max-age: 3600
      default-filters:
        # Downstream services may also add CORS headers; keep a single copy.
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      # Routes resolve through Eureka (lb://). Services that aren't running yet
      # simply return 503 until they come online in later phases.
      # Note: /internal/** is deliberately NOT routed — service-to-service only.
      routes:
        # Browser-friendly health probe: actuator endpoints sit outside the
        # gateway handler mapping, so they don't get globalcors headers.
        - id: gateway-health
          uri: forward:/actuator/health
          predicates:
            - Path=/api/health
        - id: identity-rpg-service
          uri: lb://identity-rpg-service
          predicates:
            - Path=/api/auth/**,/api/profile/**
        - id: quest-engine-service
          uri: lb://quest-engine-service
          predicates:
            - Path=/api/quests/**,/api/analytics/**
        - id: bank-store-service
          uri: lb://bank-store-service
          predicates:
            - Path=/api/wallet/**,/api/store/**,/api/admin/rewards/**
        - id: dopamine-notify-service
          uri: lb://dopamine-notify-service
          predicates:
            - Path=/api/notify/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
