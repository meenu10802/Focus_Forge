server:
  port: ${PORT:8081}

spring:
  application:
    name: identity-rpg-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5442}/identity_db
    username: ${POSTGRES_USER:focus}
    password: ${POSTGRES_PASSWORD:focus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.focusforge.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

focus:
  jwt:
    # Shared with api-gateway. Dev default only — set JWT_SECRET in any real environment.
    secret: ${JWT_SECRET:dev-only-focusforge-secret-change-me-0123456789}
    issuer: focusforge
    ttl: 24h
  rpg:
    max-hp: 100
    # Day boundary for the lazy daily HP reset.
    timezone: ${FOCUS_TZ:Asia/Kolkata}
    dashboard-cache-ttl: 10m
    # Comma-separated emails that get the ADMIN role on registration.
    admin-emails: ${FOCUS_ADMIN_EMAILS:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
