server:
  port: ${PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # This IS the registry; it doesn't register with or fetch from itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Dev-friendly: evict dead instances quickly instead of protecting them.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
