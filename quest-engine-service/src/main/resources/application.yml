server:
  port: ${PORT:8084}

spring:
  application:
    name: quest-engine-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5442}/quest_db
    username: ${POSTGRES_USER:focus}
    password: ${POSTGRES_PASSWORD:focus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Loads tasks for a page of quests in one IN (...) query instead of N+1.
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
  cloud:
    loadbalancer:
      cache:
        ttl: ${LB_CACHE_TTL:5s}

focus:
  ai-client:
    # Logical Eureka name, resolved by the @LoadBalanced RestClient.
    base-url: http://ai-quest-service
    # Must exceed ai-quest-service's worst case (2 attempts x read-timeout + backoff).
    read-timeout: 30s
  quests:
    list-limit: 20
    abandon-hp-penalty: 10
  outbox:
    poll-interval-ms: 500
    batch-size: 100

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: ${EUREKA_FETCH_INTERVAL:5}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
